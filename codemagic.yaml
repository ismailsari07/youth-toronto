# Only for the yaml-configured Codemagic app used for App Store screenshots.
# The release build stays in the Workflow Editor app, which ignores this file.
workflows:
  screenshots:
    name: App Store screenshots (6.9", en + tr)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
    # No triggering section: it runs only when started by hand.
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build for the simulator (no signing)
        script: flutter build ios --simulator --debug -t screenshots/main.dart
      - name: Take the screenshots
        script: screenshots/take.sh
    artifacts:
      - screenshots/out/**/*.png
